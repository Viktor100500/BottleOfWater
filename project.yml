name: BottleOfWater
options:
  bundleIdPrefix: com.vlasov
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: KZDJV245WR
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  BottleOfWater:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Bottle of Water
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSHealthUpdateUsageDescription: "Bottle of Water saves every drink you log to Apple Health, so your water intake stays in one place."
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.vlasov.bottleofwater.refresh]
        LSApplicationQueriesSchemes: [x-apple-health, googlegmail, ms-outlook]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vlasov.bottleofwater
        CODE_SIGN_ENTITLEMENTS: App/BottleOfWater.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: BottleWidget
        embed: true
  BottleWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget/Sources
      - Widget/Resources
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Bottle of Water
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vlasov.bottleofwater.widget
        CODE_SIGN_ENTITLEMENTS: Widget/BottleWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
  BottleOfWaterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: BottleOfWater
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vlasov.bottleofwater.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BottleOfWater:
    build:
      targets:
        BottleOfWater: all
        BottleWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BottleOfWaterTests
    archive:
      config: Release
  BottleWidget:
    build:
      targets:
        BottleWidget: all
        BottleOfWater: all
    run:
      config: Debug
